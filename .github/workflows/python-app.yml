# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync DAGs and mortgage files to MinIO
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
          S3_ENDPOINT: ${{ secrets.S3_SNO_URL }}
        run: |
          set -euo pipefail

          # GitHub-hosted Ubuntu runners generally have AWS CLI preinstalled.
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --user awscli
            export PATH="$HOME/.local/bin:$PATH"
          fi
          aws --version

          # OpenShift Route: use path-style S3 URLs instead of bucket subdomains.
          aws configure set default.s3.addressing_style path

          # S3_SNO_URL must point to the MinIO S3 API endpoint (not the console).
          # AWS CLI sync --delete mirrors the old mc mirror --remove behavior.
          aws --endpoint-url "$S3_ENDPOINT" s3 sync ./dags/ s3://airflow/dags/ --delete --no-progress
          aws --endpoint-url "$S3_ENDPOINT" s3 sync ./mortgage/ s3://mortgage/ --delete --no-progress
